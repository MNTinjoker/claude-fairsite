<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background Radial Gradient -->
    <radialGradient id="cosmicBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#241b5e" />
      <stop offset="35%" stop-color="#111638" />
      <stop offset="70%" stop-color="#070a1a" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>

    <!-- Floor Perspective Glow -->
    <radialGradient id="floorGlow" cx="50%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Squircle Border Gradient -->
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Paddle Metallic Chrome Gradient -->
    <linearGradient id="vausHull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="12%" stop-color="#e2e8f0" />
      <stop offset="28%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="78%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Paddle End Pods (Red Laser Emitters) -->
    <linearGradient id="vausWingPod" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="25%" stop-color="#ef4444" />
      <stop offset="75%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Ball Docking Cradle / Reactor Plate -->
    <linearGradient id="dockCradleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Plasma Ball Gradient (Ball resting on paddle) -->
    <radialGradient id="plasmaBallHero" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#e0f2fe" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>

    <!-- Ball Resting Dock Contact Flare Glow -->
    <radialGradient id="dockContactGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Paddle Thruster Plume Underneath -->
    <radialGradient id="thrusterGlow" cx="50%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#1e1b4b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Arcade Brick Color Gradients -->
    <linearGradient id="brGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" /><stop offset="35%" stop-color="#eab308" /><stop offset="100%" stop-color="#713f12" />
    </linearGradient>
    <linearGradient id="brCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cffafe" /><stop offset="35%" stop-color="#06b6d4" /><stop offset="100%" stop-color="#164e63" />
    </linearGradient>
    <linearGradient id="brPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3" /><stop offset="35%" stop-color="#ec4899" /><stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="brGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7" /><stop offset="35%" stop-color="#22c55e" /><stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="brRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2" /><stop offset="35%" stop-color="#ef4444" /><stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Glow & Bloom Filters -->
    <filter id="softBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="hyperEnergy" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Cosmic Background Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#cosmicBg)" />
  <rect width="512" height="512" rx="104" fill="url(#floorGlow)" />

  <!-- 2. Retro Horizon Perspective Grid -->
  <g opacity="0.32" stroke="#38bdf8" stroke-width="1.6">
    <line x1="256" y1="310" x2="36" y2="480" />
    <line x1="256" y1="310" x2="110" y2="480" />
    <line x1="256" y1="310" x2="186" y2="480" />
    <line x1="256" y1="310" x2="256" y2="480" />
    <line x1="256" y1="310" x2="326" y2="480" />
    <line x1="256" y1="310" x2="402" y2="480" />
    <line x1="256" y1="310" x2="476" y2="480" />
    <!-- Horizontal Perspective Crossbars -->
    <line x1="184" y1="360" x2="328" y2="360" />
    <line x1="130" y1="400" x2="382" y2="400" />
    <line x1="76" y1="444" x2="436" y2="444" />
    <line x1="42" y1="480" x2="470" y2="480" />
  </g>

  <!-- 3. Distant Sparkling Stars -->
  <g fill="#ffffff">
    <circle cx="72" cy="80" r="2.2" opacity="0.8" />
    <circle cx="440" cy="74" r="2.8" opacity="0.85" />
    <circle cx="112" cy="180" r="1.8" opacity="0.6" />
    <circle cx="410" cy="190" r="2.2" opacity="0.75" />
    <circle cx="56" cy="240" r="1.5" opacity="0.5" />
    <circle cx="460" cy="250" r="1.8" opacity="0.6" />
    <!-- Twinkle Cross -->
    <path d="M 440 67 L 440 81 M 433 74 L 447 74" stroke="#ffffff" stroke-width="1.2" opacity="0.8" />
    <path d="M 72 74 L 72 86 M 66 80 L 78 80" stroke="#38bdf8" stroke-width="1" opacity="0.75" />
  </g>

  <!-- 4. Upper Arcade Bricks Formation (Classic Arkanoid Arch) -->
  <g filter="url(#softBloom)">
    <!-- Row 1 (Top Golden Bricks) -->
    <rect x="70" y="60" width="86" height="26" rx="5" fill="url(#brGold)" stroke="#fef08a" stroke-width="1.2" />
    <rect x="162" y="60" width="86" height="26" rx="5" fill="url(#brGold)" stroke="#fef08a" stroke-width="1.2" />
    <rect x="264" y="60" width="86" height="26" rx="5" fill="url(#brGold)" stroke="#fef08a" stroke-width="1.2" />
    <rect x="356" y="60" width="86" height="26" rx="5" fill="url(#brGold)" stroke="#fef08a" stroke-width="1.2" />

    <!-- Row 2 (Synthwave Pink & Cyan Bricks) -->
    <rect x="70" y="94" width="86" height="26" rx="5" fill="url(#brPink)" stroke="#fbcfe8" stroke-width="1.2" />
    <rect x="162" y="94" width="86" height="26" rx="5" fill="url(#brPink)" stroke="#fbcfe8" stroke-width="1.2" />
    <rect x="264" y="94" width="86" height="26" rx="5" fill="url(#brCyan)" stroke="#cffafe" stroke-width="1.2" />
    <rect x="356" y="94" width="86" height="26" rx="5" fill="url(#brCyan)" stroke="#cffafe" stroke-width="1.2" />

    <!-- Row 3 (Outer Flank Bricks - Emerald & Ruby) -->
    <rect x="70" y="128" width="86" height="26" rx="5" fill="url(#brGreen)" stroke="#bbf7d0" stroke-width="1.2" />
    <rect x="162" y="128" width="60" height="26" rx="5" fill="url(#brGreen)" stroke="#bbf7d0" stroke-width="1.2" />
    <rect x="290" y="128" width="60" height="26" rx="5" fill="url(#brRed)" stroke="#fecaca" stroke-width="1.2" />
    <rect x="356" y="128" width="86" height="26" rx="5" fill="url(#brRed)" stroke="#fecaca" stroke-width="1.2" />

    <!-- Glossy Top Bevels -->
    <g fill="#ffffff" opacity="0.45">
      <rect x="72" y="61" width="82" height="4" rx="2" />
      <rect x="164" y="61" width="82" height="4" rx="2" />
      <rect x="266" y="61" width="82" height="4" rx="2" />
      <rect x="358" y="61" width="82" height="4" rx="2" />

      <rect x="72" y="95" width="82" height="4" rx="2" />
      <rect x="164" y="95" width="82" height="4" rx="2" />
      <rect x="266" y="95" width="82" height="4" rx="2" />
      <rect x="358" y="95" width="82" height="4" rx="2" />

      <rect x="72" y="129" width="82" height="4" rx="2" />
      <rect x="358" y="129" width="82" height="4" rx="2" />
    </g>
  </g>

  <!-- 5. Under-Paddle Thruster Flare & Energy Field -->
  <ellipse cx="256" cy="382" rx="156" ry="32" fill="url(#thrusterGlow)" />
  <ellipse cx="256" cy="376" rx="95" ry="16" fill="#38bdf8" opacity="0.5" filter="url(#softBloom)" />

  <!-- 6. THE ICONIC PADDLE (VAUS) -->
  <g filter="url(#softBloom)">
    <!-- Red Laser Pod - Left Wingtip -->
    <path d="M 66 352 L 96 342 L 96 376 L 66 366 Z" fill="url(#vausWingPod)" stroke="#fca5a5" stroke-width="1.5" />
    <rect x="62" y="348" width="10" height="22" rx="4" fill="#ef4444" stroke="#ffffff" stroke-width="1" />
    <circle cx="67" cy="359" r="3.5" fill="#ffffff" />

    <!-- Red Laser Pod - Right Wingtip -->
    <path d="M 446 352 L 416 342 L 416 376 L 446 366 Z" fill="url(#vausWingPod)" stroke="#fca5a5" stroke-width="1.5" />
    <rect x="440" y="348" width="10" height="22" rx="4" fill="#ef4444" stroke="#ffffff" stroke-width="1" />
    <circle cx="445" cy="359" r="3.5" fill="#ffffff" />

    <!-- Main Curved Chrome Fuselage (Paddle Body) -->
    <!-- Top edge is at y=340, bottom at y=378, rounded ends -->
    <rect x="88" y="340" width="336" height="38" rx="19" fill="url(#vausHull)" stroke="#38bdf8" stroke-width="2.6" />

    <!-- Top Metallic Specular Highlight Ridge -->
    <path d="M 110 345 Q 256 342 402 345" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.95" />
    <!-- Underside Shadow Ridge -->
    <path d="M 112 373 Q 256 376 400 373" stroke="#030712" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- Tech Wing Ribs / Red Stripes on Left & Right -->
    <g stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round">
      <line x1="140" y1="346" x2="140" y2="372" />
      <line x1="154" y1="346" x2="154" y2="372" />
      <line x1="358" y1="346" x2="358" y2="372" />
      <line x1="372" y1="346" x2="372" y2="372" />
    </g>

    <!-- Center Magnetic Docking Cradle / Reactor Plate directly beneath the Ball -->
    <rect x="206" y="344" width="100" height="28" rx="10" fill="#031d36" stroke="#0ea5e9" stroke-width="1.8" />
    <rect x="220" y="347" width="72" height="10" rx="5" fill="url(#dockCradleGrad)" />
    <!-- Reactor Core Line Glow -->
    <line x1="232" y1="352" x2="280" y2="352" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- 7. THE ENERGY BALL RESTING DIRECTLY ON TOP OF THE PADDLE -->
  <!-- Paddle top surface is y=340. Ball radius is 48. Center is at (256, 292). Ball bottom sits precisely at y = 292 + 48 = 340! -->
  
  <!-- Ball Launch Readiness Energy Field / Aura -->
  <g filter="url(#hyperEnergy)">
    <!-- Radial aura around the resting ball -->
    <circle cx="256" cy="292" r="62" fill="#38bdf8" opacity="0.35" />
    <ellipse cx="256" cy="340" rx="56" ry="14" fill="url(#dockContactGlow)" />
  </g>

  <!-- Magnetic Ion Docking Rings (Pulsing around resting ball) -->
  <ellipse cx="256" cy="292" rx="66" ry="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" stroke-dasharray="14 8" />
  <ellipse cx="256" cy="292" rx="76" ry="16" fill="none" stroke="#818cf8" stroke-width="1.4" opacity="0.4" />

  <!-- The Ball Core Sphere -->
  <g filter="url(#softBloom)">
    <!-- Ball Outer Ring & Shadow -->
    <circle cx="256" cy="292" r="48" fill="url(#plasmaBallHero)" stroke="#e0f2fe" stroke-width="2.5" />
    <!-- Secondary Rim Glow -->
    <circle cx="256" cy="292" r="46" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
    <!-- Specular Crescent / 3D Sphere Highlight -->
    <ellipse cx="242" cy="276" rx="20" ry="12" fill="#ffffff" transform="rotate(-30 242 276)" opacity="0.9" />
    <circle cx="236" cy="270" r="6" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- 8. Magnetic Resting Dock Contact Arc (Where ball touches paddle surface at y=340) -->
  <g filter="url(#softBloom)">
    <!-- High-intensity white-hot contact point -->
    <ellipse cx="256" cy="340" rx="34" ry="7" fill="url(#dockContactGlow)" />
    <path d="M 234 340 Q 256 342 278 340" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <!-- Upward launch energy sparks -->
    <circle cx="216" cy="334" r="2.5" fill="#38bdf8" />
    <circle cx="296" cy="334" r="2.5" fill="#38bdf8" />
    <circle cx="204" cy="318" r="2" fill="#ffffff" />
    <circle cx="308" cy="318" r="2" fill="#ffffff" />
    <circle cx="256" cy="226" r="3" fill="#ffffff" opacity="0.9" />
    <path d="M 256 220 L 256 232 M 250 226 L 262 226" stroke="#38bdf8" stroke-width="1.2" />
  </g>

  <!-- 9. App Store / PWA Squircle Border -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="url(#iconBorder)" stroke-width="8" opacity="0.92" />
  <rect x="14" y="14" width="484" height="484" rx="94" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
</svg>
